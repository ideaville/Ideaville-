<!DOCTYPE html>

            <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>

            <stop offset="55%" stop-color="#000" stop-opacity="0"/>
            <stop offset="100%" stop-color="#000" stop-opacity="0.38"/>
          </radialGradient>

      <header class="brand" id="brand">
        <div class="brand-name">Ideaville</div>
        <div class="brand-rule"></div>
        <div class="brand-co">Alpha Performance Solutions</div>
      </header>

      <aside class="slate">
        <div class="slate-place">Greenwich · SE London</div>
        <div class="slate-pc">SE18 3EU</div>
      </aside>

      <section class="lower">
        <h1 id="headline">Know the house.</h1>
        <p class="support" id="support">Live EPC lookup. Retrofit need. Scheme fit.</p>
        <div class="band" id="band" aria-hidden="true"><span>D</span></div>
        <p class="cta" id="cta"><span>Check a postcode</span><span class="rule" id="rule"></span></p>
      </section>
    </main>

  <div id="controls">
    <button type="button" id="play">Play</button>
    <input id="scrub" type="range" min="0" max="10000" value="0" aria-label="Scrub time" />
    <span id="readout">0.0s</span>

  <script src="ad.js"></script>
