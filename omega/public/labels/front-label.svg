<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" role="img" aria-labelledby="title desc">
  <title id="title">OMEGA Performance Additives - Front Label Prototype</title>
  <desc id="desc">Matte black front label concept with gold text-only OMEGA mark, electric blue divider, and PETROL ONLY. Design concept not for production.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8D48A"/>
      <stop offset="45%" stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#8A7018"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161616"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" rx="28" fill="url(#panel)"/>
  <rect x="18" y="18" width="364" height="564" rx="18" fill="none" stroke="#2A2A2A" stroke-width="1.5"/>
  <text x="200" y="210" text-anchor="middle" font-family="Syne, Arial Black, sans-serif" font-size="72" font-weight="800" letter-spacing="14" fill="url(#gold)">OMEGA</text>
  <text x="200" y="255" text-anchor="middle" font-family="DM Sans, Arial, sans-serif" font-size="16" font-weight="500" letter-spacing="6" fill="#C9A227">PERFORMANCE ADDITIVES</text>
  <rect x="120" y="280" width="160" height="3" fill="#00A8E8"/>
  <text x="200" y="520" text-anchor="middle" font-family="DM Sans, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="4" fill="#F4F4F0">PETROL ONLY</text>
  <text x="200" y="552" text-anchor="middle" font-family="DM Sans, Arial, sans-serif" font-size="9" letter-spacing="1.5" fill="#777">DESIGN CONCEPT - NOT FOR PRODUCTION</text>
</svg>
